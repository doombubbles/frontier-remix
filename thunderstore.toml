[package]
name = "FrontierRemix"
namespace = "doombubbles"
description = "Adds some Quality of Life changes to Frontier Legends."
websiteUrl = "https://github.com/doombubbles/FrontierRemix"

[package.dependencies]
LavaGang-MelonLoader = "0.7.3"
doombubbles-Btd6ModHelper = "3.6.5"

[build]
icon = "./Icon.png"
readme = "./README.md"
outdir = "bin"

[[build.copy]]
source = "./bin/Release/FrontierRemix.dll"
target = "FrontierRemix.dll"

[[build.copy]]
source = "./CHANGELOG.md"
target = "./CHANGELOG.md"

[[build.copy]]
source = "./LICENSE"
target = "./LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = ["bloons-td-6"]
categories = ["mods"]
